# QuantEmbrace Instrument Registry
# ─────────────────────────────────────────────────────────────────────────────
# Per-instrument risk parameters consumed by Phase 4 validators.
# Every symbol traded must have an entry here before being enabled in
# strategy config (scripts/strategy/config.py go-live).
#
# Fields:
#   sector           (required) GICS-style sector name.  Used by
#                               SectorConcentrationValidator.
#   market           (required) "NSE" or "US"
#   max_spread_bps   (optional) Override global spread threshold.
#                               Default: 50 bps (SpreadGateValidator).
#   max_order_adv_pct (optional) Override global ADV % threshold.
#                               Default: 1.0% (LiquidityValidator).
#   max_position_size (optional) Max shares for a single position.
#                               Default: from RiskLimits.max_position_per_symbol
#
# Sector taxonomy (keep consistent — SectorConcentrationValidator groups by exact string):
#   FINANCIAL_SERVICES  — banks, NBFCs, insurance, brokerages
#   IT_SERVICES         — TCS, Infosys, Wipro, HCL, Tech Mahindra (paused)
#   PRODUCT_IT          — Tata Elxsi, Persistent Systems
#   ENERGY              — ONGC, Reliance, BPCL, IOC, HINDPETRO, OIL, ATGL
#   GREEN_ENERGY        — Adani Green, Adani Power, Tata Power, NHPC, SJVN, Torrent Power
#   CONSUMER_STAPLES    — HUL, ITC, Nestle, Britannia
#   CONSUMER_DISCRETIONARY — Titan, Maruti, M&M, Bajaj Auto
#   PHARMA              — Sun Pharma, Dr Reddy, Cipla, Divis, Apollo Hospitals
#   METALS_MINING       — Tata Steel, Hindalco, Vedanta, Coal India
#   TELECOM             — Airtel, Jio (Reliance), Vodafone-Idea
#   INFRASTRUCTURE      — L&T, Power Grid, NTPC, Adani Ports
#   DEFENCE             — HAL, BEL, BEML, BHEL, Cochin Shipyard, Mazagon Dock
#   CHEMICALS           — Deepak Fertilisers, Grasim Industries
#   AVIATION            — IndiGo (INDIGO)
#   CONGLOMERATE        — Adani Enterprises
#   REALESTATE          — DLF, Godrej Properties, Prestige
#   US_TECH             — AAPL, GOOGL, MSFT, NVDA, META
#   US_FINANCE          — JPM, BAC, GS, MS
#   US_CONSUMER         — AMZN, TSLA, NKE
#   US_HEALTHCARE       — JNJ, PFE, UNH, ABBV
# ─────────────────────────────────────────────────────────────────────────────

