name: no_hardcoded_secrets
type: pre_commit
priority: 1
mandatory: true

description: |
  No credentials, API keys, tokens, or secrets may be hardcoded in source files.
  All secrets must be stored in AWS Secrets Manager at the canonical path:
    quantembrace/{env}/{service}/{name}
  and retrieved at runtime via boto3 SecretsManager client.

  This rule applies to ALL committed files in services/, configs/, infra/, and scripts/.
  It is enforced by the secrets_blocker.sh PreToolUse hook and must also be checked
  during code review and pre-commit CI.

  Zerodha access tokens expire daily (~07:30 IST) and are managed exclusively by
  ZerodhaTokenManager via DynamoDB — never via environment variable literals in source.
  See anti-patterns #14 and #15 in memory/anti_patterns.md.

trigger:
  event: pre_commit
  paths:
    - "services/**"
    - "configs/**"
    - "infra/**"
    - "scripts/**"
  exclude_paths:
    - "tests/**"
    - "docs/**"
    - "memory/**"
    - ".claude/**"
    - "scripts/hooks/**"

forbidden_patterns:
  - description: "Credential key-value assignment with literal string"
    pattern: '(?i)(api_key|api_secret|access_token|zerodha.*token|alpaca.*key)\s*=\s*["\'][^"''${\s<>]{10,}["\']'
    exclude_line_prefixes:
      - "#"
    exclude_line_contains:
      - "your_"
      - "example"
      - "placeholder"
      - "{"
      - "$"
      - "<"
      - "test_"
      - "os.environ"
      - "os.getenv"
      - "environ.get"

  - description: "JWT token literal (eyJ...)"
    pattern: 'eyJ[A-Za-z0-9_-]{20,}'
    note: "JWT tokens must never appear in source. Use SecretsManager."

  - description: "Alpaca API key literal (PKTEST...)"
    pattern: '\bPKTEST[A-Za-z0-9]{10,}\b'
    note: "Alpaca API keys must be stored in SecretsManager, not source."

  - description: "40-character hex token assigned to a variable"
    pattern: '(?i)(token|secret|key|password|passwd|pwd)\s*=\s*["\'][0-9a-f]{40}["\']'
    note: "Likely a SHA-1 hash or access token — use SecretsManager."

  - description: ".env files committed to git"
    pattern: '^\.env'
    applies_to: ".gitignore check"
    note: ".env files must never be committed. Add to .gitignore."

secrets_manager_convention:
  path_template: "quantembrace/{env}/{service}/{name}"
  examples:
    - "quantembrace/prod/execution_engine/zerodha_api_key"
    - "quantembrace/prod/execution_engine/zerodha_api_secret"
    - "quantembrace/paper/ai_engine/openai_api_key"
    - "quantembrace/staging/data_ingestion/alpaca_api_key"
  retrieval_pattern: |
    # Correct: retrieve from SecretsManager at runtime
    import boto3, json
    client = boto3.client("secretsmanager")
    secret = json.loads(
        client.get_secret_value(SecretId="quantembrace/prod/execution_engine/zerodha_api_key")
        ["SecretString"]
    )
    api_key = secret["api_key"]

enforcement:
  script: "scripts/hooks/secrets_blocker.sh"
  ci_step: "pre-commit secrets scan"
  review_gate: "mandatory — reviewer must confirm no credentials in diff"

on_violation:
  - action: block_commit
  - action: alert
    message: |
      CRITICAL: Hardcoded credential detected in commit.
      Secrets must NEVER be committed to source control.
      Store in AWS Secrets Manager: quantembrace/{env}/{service}/{name}
      Retrieve at runtime via boto3 SecretsManager client.
      Rotate the leaked credential immediately if it was a real value.
