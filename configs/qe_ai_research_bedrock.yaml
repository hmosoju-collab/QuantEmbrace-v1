# qe.ai research on REAL Claude via Amazon Bedrock (ADR-043 P10). Requires
# `pip install -r requirements-ai.txt`, AWS credentials with bedrock-mantle:CreateInference on the
# model, and an explicit `--allow-llm-spend` on the CLI (refused otherwise, before any write).
#
# This is the SMOKE profile: FAST mode, 3 symbols, hard 60k-token run budget (worst case well
# under $1 at $4/$20 per MTok). Signals dated within the model's knowledge cutoff + guard are
# CONTAMINATED and can never carry weight or accrue to the shadow gate (lookahead-prevention §2).
schema_version: qe_ai_research/1
name: delivery-book-ai-research-bedrock
book_config: configs/qe_delivery_book_paper.yaml
research_mode: FAST
backend: bedrock
region: ap-south-1            # global endpoint is available in ap-south-1 (Mumbai)
effort: low                   # Opus 5.5 thinking cannot be disabled; effort is the only control
quick_model:
  model_id: anthropic.claude-opus-5-5
  tier: quick
  knowledge_cutoff: 2026-06-30   # training-data cutoff "Jun 2026" (Anthropic models overview) — conservative month-end
deep_model:
  model_id: anthropic.claude-opus-5-5
  tier: deep
  knowledge_cutoff: 2026-06-30
budget:
  max_run_tokens: 60000
  max_tokens_per_call: 4096      # thinking tokens are billed as output and count against this
  timeout_s: 60
  max_retries: 1
  breaker_threshold: 3
  retry_backoff_s: 2.0
guard_days: 90                   # → first uncontaminated decision date: 2026-09-29
max_symbols: 3
mask_identifiers: true
seed: 0
use_cache: true
