# Delivery-% forward factor book — REAL-TIME PAPER mode (qe v2, ADR-037/038).
# Run at month-end: `python -m qe paper --config configs/qe_delivery_book_paper.yaml`
# Advisory only. PaperBroker (no real venue). Live trading remains BLOCKED.
name: momentum-book-paper
mode: paper
start_date: 2025-12-31          # inception (informational; book resumes from persisted state)
end_date: 2027-12-31            # open horizon for the forward program
universe: {market: NSE, segment: EQ, symbols: null}
data: {lake_root: backtest-data/lake, interval: 1d}
journal_dir: journals
seed_nav: 1000000.0
strategy: {kind: factor_book, factor: momentum, top_n: 200, k: 20, max_weight: 0.08, cash_buffer: 0.02, rebalance: monthly}
risk:
  max_drawdown_frac: 0.35       # auto-halt if book draws down >35% from peak
  max_data_age_days: 7          # fail-closed if lake data older than 7 days
