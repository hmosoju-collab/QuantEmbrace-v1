# ─────────────────────────────────────────────────────────────────────────────
# BSE-ONLY STOCKS (no NSE listing)
# ─────────────────────────────────────────────────────────────────────────────
bse_only: []

# ─────────────────────────────────────────────────────────────────────────────
# KNOWN ASM STOCKS
# Updated from NSE ASM circulars. Production: fetch live from NSE ASM feed.
# Treat this as emergency backup when live feed is unavailable.
# ─────────────────────────────────────────────────────────────────────────────
known_asm: []

# ─────────────────────────────────────────────────────────────────────────────
# KNOWN GSM STOCKS
# ─────────────────────────────────────────────────────────────────────────────
known_gsm: []

# ─────────────────────────────────────────────────────────────────────────────
# MANUAL OVERRIDES
# Symbols explicitly approved despite failing one or more filters.
# Every override MUST have an audit_reason and reviewer.
# ─────────────────────────────────────────────────────────────────────────────
manual_override:
  # Example:
  # - symbol: SOMESTOCK
  #   bypass_filter: liquidity          # Which filter to bypass
  #   audit_reason: "Temporary illiquidity due to Q4 results blackout; expect recovery by 2026-06-01"
  #   approved_by: "hari.mosoju@gmail.com"
  #   approved_at: "2026-05-26"
  #   expires_at: "2026-06-01"
  []
