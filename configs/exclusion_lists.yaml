  - BANKBEES
  - GOLDBEES
  - ICICINIFTY
  - HDFCNIFTY
  - KOTAKNIFTY
  - SETFNIF50
  - SBIETFNIFTY
  - MIDCAPETF
  - JUNIORBEES
  - MOM50
  - MAFANG
  - CPSEETF
  - CONSUMBEES
  - INFRABEES
  - DIVOPPBEES
  - ITBEES
  - PHARMABEES
  - PSUBNKBEES
  - LIQUIDBEES
  - LIQUIDCASE

# ─────────────────────────────────────────────────────────────────────────────
# REIT & InvIT SYMBOLS — excluded by default
# ─────────────────────────────────────────────────────────────────────────────
reit_invit:
