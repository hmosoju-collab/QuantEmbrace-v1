###############################################################################
# QuantEmbrace - Deploy: EC2 Auto Scaling Groups
#
# Source of truth:
#   Terraform provisions EC2 launch templates + ASGs in
#   infra/terraform/modules/ec2_services. There are no ECS task definitions in
#   this deployment model.
#
# Flow:
#   1. Build workflow pushes immutable <sha> images to ECR.
#   2. Staging deployment promotes available <sha> images to latest-staging.
#   3. EC2 ASG instance refresh replaces instances that pull latest-staging.
#   4. Production approval promotes available <sha> images to latest-prod.
#   5. Production ASGs refresh in risk-safe order: risk -> execution -> data/strategy.
#
# Required secrets:
#   AWS_DEPLOY_ROLE_ARN
#   AWS_ECR_REGISTRY
###############################################################################

name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_DEFAULT_REGION: ap-south-1

jobs:
  check-build:
    name: Check upstream build
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha: ${{ steps.get-sha.outputs.sha }}
    steps:
      - name: Get triggering commit SHA
        id: get-sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "Deploying SHA: ${SHA:0:8}"

  deploy-staging:
    name: Deploy EC2 -> staging
    runs-on: ubuntu-latest
    needs: check-build
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_service: risk_engine
            asg: quantembrace-staging-risk-engine-asg
          - image_service: execution_engine
            asg: quantembrace-staging-execution-engine-asg
          - image_service: data_ingestion
            asg: quantembrace-staging-data-ingestion-nse-asg
          - image_service: data_ingestion
            asg: quantembrace-staging-data-ingestion-us-asg
          - image_service: strategy_engine
            asg: quantembrace-staging-strategy-engine-asg
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Promote image tag for staging
        run: |
          scripts/deploy/promote_ecr_image.sh \
            --repository "quantembrace-${{ matrix.image_service }}" \
            --source-tag "${{ needs.check-build.outputs.sha }}" \
            --target-tag "latest-staging"

      - name: Refresh EC2 ASG
        id: refresh
        run: |
          scripts/deploy/refresh_asg.sh \
            --asg "${{ matrix.asg }}" \
            --min-healthy 0 \
            --instance-warmup 120

      - name: Check ASG health
        run: |
          python scripts/deploy/check_asg_health.py \
            --asg "${{ matrix.asg }}" \
            --allow-zero-desired

  smoke-test-staging:
    name: Smoke test staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Run integration smoke tests
        run: |
          pytest tests/integration/ -v \
            --tb=short \
            -m smoke \
            --timeout=120
        env:
          QE_ENVIRONMENT: staging
          ENVIRONMENT: staging
          AWS_DEFAULT_REGION: ${{ env.AWS_DEFAULT_REGION }}

      - name: Check staging ASGs
        run: |
          for ASG in \
            quantembrace-staging-risk-engine-asg \
            quantembrace-staging-execution-engine-asg \
            quantembrace-staging-data-ingestion-nse-asg \
            quantembrace-staging-data-ingestion-us-asg \
            quantembrace-staging-strategy-engine-asg
          do
            python scripts/deploy/check_asg_health.py --asg "$ASG" --allow-zero-desired
          done

  await-prod-approval:
    name: Await prod approval
    runs-on: ubuntu-latest
    needs: smoke-test-staging
    environment: prod
    steps:
      - name: Approval received
        run: echo "Production EC2 deployment approved for SHA ${{ needs.check-build.outputs.sha }}"

  deploy-prod:
    name: Deploy EC2 -> prod
    runs-on: ubuntu-latest
    needs: [check-build, await-prod-approval]
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - image_service: risk_engine
            asg: quantembrace-prod-risk-engine-asg
          - image_service: execution_engine
            asg: quantembrace-prod-execution-engine-asg
          - image_service: data_ingestion
            asg: quantembrace-prod-data-ingestion-nse-asg
          - image_service: data_ingestion
            asg: quantembrace-prod-data-ingestion-us-asg
          - image_service: strategy_engine
            asg: quantembrace-prod-strategy-engine-asg
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Promote image tag for prod
        run: |
          scripts/deploy/promote_ecr_image.sh \
            --repository "quantembrace-${{ matrix.image_service }}" \
            --source-tag "${{ needs.check-build.outputs.sha }}" \
            --target-tag "latest-prod"

      - name: Refresh EC2 ASG
        run: |
          scripts/deploy/refresh_asg.sh \
            --asg "${{ matrix.asg }}" \
            --min-healthy 0 \
            --instance-warmup 180

      - name: Check ASG health
        run: |
          python scripts/deploy/check_asg_health.py \
            --asg "${{ matrix.asg }}" \
            --allow-zero-desired

  verify-prod:
    name: Verify prod health
    runs-on: ubuntu-latest
    needs: [check-build, deploy-prod]
    if: always() && needs.deploy-prod.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Check prod ASGs
        run: |
          for ASG in \
            quantembrace-prod-risk-engine-asg \
            quantembrace-prod-execution-engine-asg \
            quantembrace-prod-data-ingestion-nse-asg \
            quantembrace-prod-data-ingestion-us-asg \
            quantembrace-prod-strategy-engine-asg
          do
            python scripts/deploy/check_asg_health.py --asg "$ASG" --allow-zero-desired
          done

      - name: Deployment summary
        run: |
          echo "## Production EC2 Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA | \`${{ needs.check-build.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | prod |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | ${{ env.AWS_DEFAULT_REGION }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASGs | risk, execution, data-ingestion-nse, data-ingestion-us, strategy |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployed at | $(date -u) |" >> "$GITHUB_STEP_SUMMARY"

  cancel-refresh-on-failure:
    name: Cancel active prod instance refreshes
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: failure() && needs.deploy-prod.result == 'failure'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Cancel active ASG refreshes
        run: |
          for ASG in \
            quantembrace-prod-risk-engine-asg \
            quantembrace-prod-execution-engine-asg \
            quantembrace-prod-data-ingestion-nse-asg \
            quantembrace-prod-data-ingestion-us-asg \
            quantembrace-prod-strategy-engine-asg
          do
            aws autoscaling cancel-instance-refresh \
              --auto-scaling-group-name "$ASG" || true
          done

      - name: Rollback warning
        run: |
          echo "## Production Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Active EC2 instance refreshes were cancelled where possible." >> "$GITHUB_STEP_SUMMARY"
          echo "Because EC2 deploys use mutable latest-prod tags, operator review is required before retagging any previous image digest." >> "$GITHUB_STEP_SUMMARY"
