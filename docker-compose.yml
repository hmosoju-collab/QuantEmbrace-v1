# QuantEmbrace — Local Paper Trading Stack
#
# Starts everything needed to run all 5 services in paper-trading mode locally.
# No real broker credentials are required; paper signals never hit Zerodha or Alpaca.
#
# QUICK START
# ───────────────────────────────────────────────────────────────────────────────
#   1. cp .env.example .env
#   2. Fill in KAFKA_BOOTSTRAP_SERVERS (leave it empty — overridden to localhost below)
#   3. docker-compose up -d localstack redpanda          # infra only
#   4. docker-compose run --rm setup                     # create DynamoDB tables + Kafka topics
#   5. docker-compose up                                 # start all services
#
# OR just: docker-compose up  (setup runs first via depends_on)
#
# PAPER TRADING
#   All signals default to paper_trade=True (controlled by DynamoDB strategy-config).
#   Execution engine routes paper signals to the built-in simulator — no broker API calls.
#
# KAFKA AUTH
#   Local Redpanda uses PLAINTEXT. KAFKA_USE_IAM=false is set for all services.
#   MSK Serverless (production) uses SASL_SSL + IAM — set KAFKA_USE_IAM=true.
#
# PORTS (host)
#   LocalStack     : http://localhost:4566  (DynamoDB, S3)
#   Redpanda       : localhost:19092        (Kafka, external)
#   Redpanda Admin : http://localhost:9644
#   Redpanda Console: http://localhost:8080 (topic browser)
#   data_ingestion : http://localhost:8081/health
#   strategy_engine: http://localhost:8082/health
#   risk_engine    : http://localhost:8083/health
#   execution_engine: http://localhost:8084/health
#   ai_engine      : http://localhost:8085/health
#   monitoring_agent: http://localhost:8086/health  (read-only observer, Phase 1)
#
# ─────────────────────────────────────────────────────────────────────────────

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: infra/deployment/Dockerfile
  env_file: .env
  environment:
    # Override broker string to point at local Redpanda (internal Docker network)
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    # Disable IAM auth — local Redpanda uses PLAINTEXT
    KAFKA_USE_IAM: "false"
    # AWS SDK → LocalStack
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_DEFAULT_REGION: ap-south-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    # DynamoDB table prefix for local dev
    DYNAMODB_TABLE_PREFIX: quantembrace-development
    # S3 buckets — settings.py reads AWS_S3_BUCKET (env_prefix=AWS_); created by setup_local_tables.py
    AWS_S3_BUCKET: quantembrace-market-data
    AWS_S3_MODEL_BUCKET: quantembrace-ml-models
    # Paper trading safety net
    RISK_PROFILE: paper
    QE_ENVIRONMENT: development
    LOG_LEVEL: INFO
  depends_on:
    setup:
      condition: service_completed_successfully
  restart: unless-stopped


services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level warn
      - --blocked-reactor-notify-ms 2000
    ports:
      - "19092:19092"   # Kafka — host access for scripts/local tools
      - "18082:18082"   # Pandaproxy (HTTP Kafka)
      - "9644:9644"     # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redpanda-console:
    image: redpandadata/console:v2.6.0
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat <<EOF > /tmp/config.yml
        kafka:
          brokers: ["redpanda:9092"]
        EOF
        /app/console
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.4
    environment:
      SERVICES: s3,dynamodb
      DEFAULT_REGION: ap-south-1
      PERSISTENCE: 1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -qE '\"dynamodb\": \"(available|running)\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - localstack-data:/var/lib/localstack

  # ── One-shot setup: create DynamoDB tables + Kafka topics ──────────────────

  setup:
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile
    env_file: .env
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: quantembrace-development
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_USE_IAM: "false"
      QE_ENVIRONMENT: development
      # Align paper NAV with risk_limits_production.yaml portfolio_value: 1,000,000
      # Default in code was 5,000,000 (5x mismatch causing over-permissive margin checks)
      PAPER_SEED_NAV: "1000000"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "=== Creating DynamoDB tables ===" && \
        python /app/scripts/setup_local_tables.py && \
        echo "=== Creating Kafka topics ===" && \
        python /app/scripts/kafka/create_topics.py \
          --bootstrap-servers redpanda:9092 \
          --short-retention && \
        echo "=== Setup complete ==="
    depends_on:
      localstack:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts:ro

  # ── Trading Services ────────────────────────────────────────────────────────

  data_ingestion:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile
      args:
        SERVICE_NAME: data_ingestion
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_USE_IAM: "false"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: quantembrace-development
      DYNAMODB_TABLE_SESSIONS: quantembrace-development-sessions
      QE_ENVIRONMENT: development
      LOG_LEVEL: INFO
      QE_HEALTH_CHECK_PORT: "8081"
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:-paper_placeholder}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET:-paper_placeholder}
      ZERODHA_ACCESS_TOKEN: ${ZERODHA_ACCESS_TOKEN:-}
      AWS_S3_BUCKET: quantembrace-development-data
      # Allow last-known prices from reconnect dumps to pass through in paper mode
      DATA_INGESTION_TICK_STALE_THRESHOLD: "86400"
    volumes:
      - ./configs:/app/configs:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  strategy_engine:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile
      args:
        SERVICE_NAME: strategy_engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_USE_IAM: "false"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: quantembrace-development
      QE_ENVIRONMENT: development
      RISK_PROFILE: paper
      # Dynamic universe — fetch NIFTY 100 / F&O symbol list from NSE archive
      # CSVs at startup. Keeps strategy_engine, execution_engine universe gate,
      # and LiveQuotePoller all on the same symbol set without manual sync.
      UNIVERSE_USE_LIVE_API: "true"
      UNIVERSE_MODE: PAPER_EXPAND
      LOG_LEVEL: INFO
      QE_HEALTH_CHECK_PORT: "8082"
    volumes:
      - ./configs:/configs:ro
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  risk_engine:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile
      args:
        SERVICE_NAME: risk_engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_USE_IAM: "false"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: quantembrace-development
      QE_ENVIRONMENT: development
      RISK_PROFILE: paper
      RISK_DAILY_LOSS_HALT_PCT: "3.0"
      # Signal age limit — matches risk_limits_production.yaml max_signal_age_seconds: 30.
      # Default in code is 5.0s which rejects candle-based signals that take >5s to process.
      RISK_MAX_SIGNAL_AGE_SECONDS: "30"
      LOG_LEVEL: INFO
      QE_HEALTH_CHECK_PORT: "8083"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8083/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  execution_engine:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile
      args:
        SERVICE_NAME: execution_engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_USE_IAM: "false"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: quantembrace-development
      QE_ENVIRONMENT: development
      RISK_PROFILE: paper
      # Universe mode — controls which symbols may be traded.
      # Fetch live NIFTY 100 / F&O constituents from NSE archive CSVs at startup.
      # Falls back to configs/universe_modes.yaml if NSE is unreachable.
      UNIVERSE_USE_LIVE_API: "true"
      # PAPER_EXPAND = NIFTY 100 + F&O (matches current STRATEGY_WATCHLIST_NSE scope).
      # Promote to LIVE_ADVANCED only after passing promotion gates in configs/promotion_gates.yaml.
      UNIVERSE_MODE: PAPER_EXPAND
      # Broker credentials — optional for paper trading (paper signals skip broker calls)
      # Set real values only when promoting to live trading
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:-paper_placeholder}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET:-paper_placeholder}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-paper_placeholder}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-paper_placeholder}
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_USE_PAPER: "true"
      # Paper simulation parameters
      EXECUTION_PAPER_SLIPPAGE_BPS: "5.0"
      EXECUTION_PAPER_SPREAD_BPS: "10.0"
      EXECUTION_PAPER_LATENCY_MS: "250"
      EXECUTION_PAPER_PARTIAL_FILL_PROBABILITY: "0.0"
      EXECUTION_PAPER_REJECT_PROBABILITY: "0.0"
      EXECUTION_PAPER_RANDOM_SEED: quantembrace-paper-v1
      LOG_LEVEL: INFO
      QE_HEALTH_CHECK_PORT: "8084"
      # STRATEGY_WATCHLIST_NSE removed — LiveQuotePoller now reads symbols
      # directly from _universe_validator.snapshot.approved_symbols (same
      # NSE CSV source as the universe hard gate). No manual sync needed.
    volumes:
      # universe_modes.yaml + exclusion_lists.yaml are resolved relative to /app/configs
      - ./configs:/app/configs:ro
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8084/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ai_engine:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile
      args:
        SERVICE_NAME: ai_engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_USE_IAM: "false"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: quantembrace-development
      QE_ENVIRONMENT: development
      LOG_LEVEL: INFO
      QE_HEALTH_CHECK_PORT: "8085"
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8085/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Monitoring Agent (Phase 1 — READ-ONLY observer) ──────────────────────────
  # A sibling watcher, NOT a trading service. It probes the 5 services' /health,
  # reads Kafka metadata + committed offsets, DescribeTable's DynamoDB, and infers
  # broker freshness from the latest-prices table. It NEVER writes to the trading
  # platform. DRY_RUN=true + ACTION_MODE=notify_only are hard safety defaults and
  # Phase 1 wires no action layer at all. Does NOT use *service-defaults (separate
  # image; must not be gated the same way as capital-path services).
  monitoring_agent:
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile.monitoring_agent
    environment:
      # ── Safety contract (mandatory) ──
      MONITORING_DRY_RUN: "true"
      MONITORING_ACTION_MODE: notify_only
      # ── Loop / health ──
      MONITORING_POLL_INTERVAL_SECONDS: "30"
      QE_HEALTH_CHECK_PORT: "8086"
      LOG_LEVEL: INFO
      # ── Kafka (read-only metadata + offsets via local Redpanda, PLAINTEXT) ──
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_USE_IAM: "false"
      # ── AWS → LocalStack (read-only DescribeTable + bounded scans) ──
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE_PREFIX: quantembrace-development
      # ── Agent paths ──
      MONITORING_RULES_PATH: /app/services/monitoring_agent/rules.yaml
      MONITORING_SNAPSHOT_PATH: /app/data/health_snapshot.json
      MONITORING_INCIDENT_LOG_PATH: /app/data/monitoring_incidents.jsonl
      # ── Slack (optional — agent log-only falls back when unset) ──
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#trading-ops}
    # Root is required to read the Docker socket (owned root:root, mode 660).
    # Read-only safety is enforced at code level — docker_collector only ever
    # calls list()/reload()/inspect. In production replace with a socket proxy.
    user: root
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      # Docker container liveness + restart counts. ``:ro`` limits the bind mount,
      # but the REAL read-only guarantee is code-level: docker_collector only ever
      # calls list()/reload()/inspect — never run/start/stop/exec. In production
      # prefer a docker-socket-proxy in front of this instead of the raw socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Agent-owned observability artifacts (snapshot + incident log) — survive restarts
      # so the incident log can replay and avoid re-alerting still-broken components.
      - monitoring-data:/app/data
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8086/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  redpanda-data:
  localstack-data:
  monitoring-data:
